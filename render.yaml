# Render Blueprint for the WorkLog API (frontend goes on Vercel, database on Neon).
services:
  - type: web
    name: worklog-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # Neon connection string
        sync: false
      - key: APP_PASSWORD        # the one password that unlocks the app
        sync: false
      - key: CORS_ORIGINS        # your Vercel URL, e.g. https://worklog-nandini.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: auto
